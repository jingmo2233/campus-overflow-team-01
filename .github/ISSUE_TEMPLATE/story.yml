name: Story（用户故事 / PBI）
description: 一条有业务价值的需求，对应 Product Backlog Item
title: "[PB-XX] "
labels: ["type:story"]
body:
  - type: markdown
    attributes:
      value: |
        Story 描述「谁、要做什么、为了什么价值」，不描述实现方案。
        实现拆分请在下方任务清单里用子 Issue 关联（`- [ ] #45`）。

  - type: textarea
    id: story
    attributes:
      label: 用户故事
      description: 作为……我想要……以便……
      placeholder: |
        作为一名学生，
        我想要按课程筛选问题，
        以便只看到与我这学期课程相关的内容。
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准（Given / When / Then）
      description: 每条都应可被测试验证。这是 DoR 的核心，写不出来说明需求还没澄清。
      placeholder: |
        1. Given 我已登录且选修了「数据结构」
           When 我在列表页选择该课程
           Then 只显示 courseId 匹配的问题，分页正常

        2. Given 我未选修任何课程
           When 我打开课程筛选
           Then 显示空状态提示，而不是报错
    validations:
      required: true

  - type: dropdown
    id: context
    attributes:
      label: 所属上下文
      options:
        - identity
        - qa
        - reputation
        - discovery
        - frontend
        - infra
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级（MoSCoW）
      options:
        - must
        - should
        - could
        - wont
    validations:
      required: true

  - type: input
    id: points
    attributes:
      label: 故事点
      description: Planning Poker 估算结果（1 / 2 / 3 / 5 / 8 / 13）
      placeholder: "3"

  - type: textarea
    id: tasks
    attributes:
      label: 任务拆分
      description: 用 `- [ ] #45` 关联子 Issue，或直接列出待办项
      placeholder: |
        - [ ] 领域层：Question 增加 courseId 过滤
        - [ ] 应用层：QuestionQueryService.list 支持 courseId
        - [ ] 前端：列表页课程下拉

  - type: textarea
    id: notes
    attributes:
      label: 备注 / 依赖
      description: 依赖哪些 PBI？有无需要 PO 决策的点？
