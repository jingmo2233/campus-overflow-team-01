name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  # 渐进式质量门禁：Sprint 1 阶段只测试这些模块
  SPRINT_MODULES: co-shared-kernel, co-identity/co-identity-domain, co-identity/co-identity-application, co-qa/co-qa-domain, co-qa/co-qa-application

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 关键修复：先 install 所有依赖，把 SNAPSHOT 包放进本地 .m2 仓库
      - name: 构建并安装依赖模块 (跳过测试)
        run: mvn -B -f backend/pom.xml install -DskipTests -pl "$SPRINT_MODULES" -am

      - name: 编译
        run: mvn -B -f backend/pom.xml clean compile -pl "$SPRINT_MODULES" -am

      - name: 单元测试 (Sprint范围)
        run: mvn -B -f backend/pom.xml test -pl "$SPRINT_MODULES" -am

      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest

      - name: 覆盖率门禁
        run: mvn -B -f backend/pom.xml verify -DskipITs -Djacoco.skip=false -pl "$SPRINT_MODULES" -am

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: ./frontend
        run: npm ci

      - name: 类型检查
        working-directory: ./frontend
        run: npm run typecheck

      - name: 构建
        working-directory: ./frontend
        run: npm run build
