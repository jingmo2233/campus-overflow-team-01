name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  # 渐进式质量门禁：Sprint 1 阶段只测试这些模块
  SPRINT_MODULES: co-shared-kernel, co-identity/co-identity-domain, co-identity/co-identity-application, co-qa/co-qa-domain, co-qa/co-qa-application

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 关键修复：全局安装所有模块（跳过测试），确保本地仓库有所有的 SNAPSHOT 包
      - name: 安装所有依赖模块 (跳过测试)
        run: mvn -B -f backend/pom.xml install -DskipTests

      - name: 单元测试 (Sprint范围)
        run: mvn -B -f backend/pom.xml test -pl "$SPRINT_MODULES" -am

      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 删除了 cache 配置，避免找不到 lock 文件报错

      - name: 安装依赖
        working-directory: ./frontend
        run: npm install # 用 install 替代 ci，避免强制要求 package-lock.json

      - name: 构建
        working-directory: ./frontend
        run: npm run build
