name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  # 质量门禁覆盖全部四个限界上下文的领域层与应用层。
  # 原先这份清单是 Sprint 1 的遗留，只有 shared-kernel / identity / qa 三个上下文；
  # 而 qa-application 只依赖 qa-api、qa-domain、identity-api，identity-application 只依赖
  # identity-api、identity-domain，没有任何依赖链能把 co-reputation / co-discovery 拉进
  # `-am` 的 reactor，所以 Sprint 3 合入的这两个上下文的测试从未在 CI 执行过。
  SPRINT_MODULES: co-shared-kernel, co-identity/co-identity-domain, co-identity/co-identity-application, co-qa/co-qa-domain, co-qa/co-qa-application, co-reputation/co-reputation-domain, co-reputation/co-reputation-application, co-discovery/co-discovery-domain, co-discovery/co-discovery-application

jobs:
  backend:
    name: 后端构建与验证
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 关键修复：全局安装所有模块（跳过测试），确保本地仓库有所有的 SNAPSHOT 包
      - name: 安装所有依赖模块 (跳过测试)
        run: mvn -B -f backend/pom.xml install -DskipTests

      # 用 verify 而不是 test：jacoco 的 report 与 check 都绑定在 verify 阶段的
      # prepare-agent -> report -> check 链上，只跑到 test 阶段的话覆盖率门禁一次都不会执行。
      - name: 单元测试 + 覆盖率门禁 (领域层 + 应用层)
        run: mvn -B -f backend/pom.xml verify -DskipITs -pl "$SPRINT_MODULES" -am

      - name: 架构约束检查
        run: mvn -B -f backend/pom.xml test -pl co-bootstrap -Dtest=ArchitectureTest

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 删除了 cache 配置，避免找不到 lock 文件报错

      - name: 安装依赖
        working-directory: ./frontend
        run: npm install # 用 install 替代 ci，避免强制要求 package-lock.json

      - name: 构建
        working-directory: ./frontend
        run: npm run build
